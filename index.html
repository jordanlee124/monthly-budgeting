<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1b33">
  <title>Harbour Ledger | Monthly budget</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1b33'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%238dc7f5' stroke-width='1.3'/%3E%3Cpath d='m21 11-3 7-7 3 3-7z' fill='%23f0b76e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a data-text="Skip to content" class="skip" href="#main">Skip to content</a>
  <aside class="sidebar">
    <div class="brand"><span class="brand-icon" data-icon="compass"></span><span>Harbour Ledger<small data-text="MONTHLY BUDGET">MONTHLY BUDGET</small></span></div>
    <div class="nav-label" data-text="WORKSPACE">WORKSPACE</div>
    <nav data-label="Workspace" aria-label="Workspace" id="nav"></nav>
    <div class="sidebar-bottom"><div class="local"><i></i><span><span data-text="Local workspace">Local workspace</span><small data-text="Stored in this browser">Stored in this browser</small></span></div><button id="demo" data-text="Start fresh" class="text-button" hidden>Start fresh</button></div>
  </aside>
  <main id="main">
    <header class="topbar">
      <div class="breadcrumb"><span data-text="Workspace">Workspace</span><span aria-hidden="true">/</span><strong id="crumb">Overview</strong></div>
      <div class="top-actions">
        <div class="month-control">
          <button data-action="prev" data-label="Previous month" aria-label="Previous month" data-icon="left"></button>
          <label class="month-label"><span data-icon="calendar"></span><span id="month-text"></span><input id="month" type="month" data-label="Selected month" aria-label="Selected month" min="1900-01" max="9999-12"></label>
          <button data-action="next" data-label="Next month" aria-label="Next month" data-icon="right"></button>
        </div>
        <button id="theme" class="theme-toggle" type="button" data-label="Night mode" aria-label="Night mode" title="Night mode" aria-pressed="false" data-icon="moon"></button>
        <button id="language" type="button" aria-label="Language: 한국어"><span lang="ko">한국어</span></button>
        <button class="primary" data-action="entries"><span data-icon="plus"></span><span data-text="Add transaction">Add transaction</span></button>
      </div>
    </header>
    <div id="content"></div>
    <footer>HARBOUR LEDGER <span aria-hidden="true">•</span> <span data-text="ALL AMOUNTS IN AUD">ALL AMOUNTS IN AUD</span></footer>
  </main>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="form">
      <div class="dialog-head"><h2 id="editor-title"></h2><button type="button" data-action="close" data-label="Close" aria-label="Close" data-icon="close"></button></div>
      <div id="fields"></div>
      <p id="form-error" role="alert" class="negative"></p>
      <div class="dialog-actions"><button type="button" data-action="delete" class="danger" data-text="Delete">Delete</button><button type="button" data-action="close" data-text="Cancel">Cancel</button><button class="primary" type="submit" data-text="Save changes">Save changes</button></div>
    </form>
  </dialog>
  <div id="notice" role="status"></div>
  <script type="module" src="app.mjs"></script>
</body>
</html>
